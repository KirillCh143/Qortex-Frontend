<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Nexus AI Login</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#8466e4",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "0.75rem",
                        "xl": "1rem",
                        "2xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        :root {
            --primary-color: #8466e4;
        }
        body {
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body class="font-display antialiased selection:bg-primary/30 selection:text-primary relative bg-white">
<main class="w-full flex flex-col items-center justify-center p-6 min-h-screen relative">
<div class="w-full max-w-[440px] bg-white rounded-3xl shadow-[0_20px_50px_rgba(0,0,0,0.05)] border border-slate-100 p-10">
<div class="flex flex-col items-center mb-10">
<div class="size-14 rounded-2xl bg-gradient-to-br from-primary to-[#a18cf0] flex items-center justify-center text-white shadow-xl shadow-primary/20 mb-5">
<span class="material-symbols-outlined text-[32px]">N</span>
</div>
<h1 class="text-2xl font-bold text-slate-900 tracking-tight mb-1">Nexus AI</h1>
<p class="text-slate-500 font-medium">Вход в систему</p>
</div>
<form class="space-y-6">
<div>
<label class="block text-sm font-semibold text-slate-700 mb-2 ml-1">Email</label>
<div class="relative">
<input class="w-full bg-slate-50/50 border border-slate-200/60 rounded-2xl px-5 py-3.5 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-4 focus:ring-primary/10 focus:border-primary transition-all" placeholder="example@nexus.ai" type="email"/>
</div>
</div>
<div>
<label class="block text-sm font-semibold text-slate-700 mb-2 ml-1">Пароль</label>
<div class="relative">
<input class="w-full bg-slate-50/50 border border-slate-200/60 rounded-2xl px-5 py-3.5 text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-4 focus:ring-primary/10 focus:border-primary transition-all" placeholder="••••••••" type="password"/>
</div>
</div>
<div class="pt-2">
<button class="w-full bg-[#8466e4] hover:bg-[#7254d3] text-white font-bold py-4 rounded-2xl shadow-lg shadow-primary/20 transition-all transform active:scale-[0.98]" type="submit">
                    Войти
                </button>
</div>
</form>
</div>
</main>
<footer class="fixed bottom-6 right-8 z-10">
<p class="text-slate-400 text-[11px] font-medium tracking-widest uppercase">© 2024 NEXUS AI. ВСЕ ПРАВА ЗАЩИЩЕНЫ.</p>
</footer>

</body></html>
