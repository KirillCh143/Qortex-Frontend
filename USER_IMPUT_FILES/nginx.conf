# For info - ports of nginx in docker-compose
# ports:
# - "8080:80"   #Directus
# - "8081:81"   #n8n
#
# Frontend Configuration:
# - VITE_DIRECTUS_URL=http://localhost:8080 (proxies to directus:8055)
# - VITE_N8N_WEBHOOK_URL=http://localhost:8081/webhook/chat (proxies to n8n:5678)
#
# Nginx acts as a reverse proxy to handle CORS and route requests:
# - Port 8080 (internal port 80) -> Directus backend (directus:8055)
# - Port 8081 (internal port 81) -> n8n workflow engine (n8n:5678)

events {}

http {
  # Увеличиваем лимит загрузки (нужно для Directus)
  client_max_body_size 50M;

  # =========================================================
  # SERVER 1: DIRECTUS
  # Внутренний порт: 80
  # Внешний доступ: http://localhost:8080
  # =========================================================
  server {
    listen 80;

    location / {
      
      # 1. Preflight (OPTIONS)
      if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' 'http://localhost:5173' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With, Range' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Max-Age' 1728000;
        add_header 'Content-Type' 'text/plain; charset=utf-8';
        add_header 'Content-Length' 0;
        return 204;
      }

      # 2. Основные заголовки
      add_header 'Access-Control-Allow-Origin' 'http://localhost:5173' always;
      add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
      add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With, Range' always;
      add_header 'Access-Control-Allow-Credentials' 'true' always;
      # Важно для Directus (пагинация и контент)
      add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range' always;

      # Чистим заголовки от Directus, чтобы не было дублей
      proxy_hide_header Access-Control-Allow-Origin;
      proxy_hide_header Access-Control-Allow-Methods;
      proxy_hide_header Access-Control-Allow-Headers;
      proxy_hide_header Access-Control-Allow-Credentials;

      # Проксируем на контейнер Directus
      proxy_pass http://directus:8055;
      
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # =========================================================
  # SERVER 2: n8n
  # Внутренний порт: 81
  # Внешний доступ: http://localhost:8081
  # =========================================================
  server {
    listen 81;

    location / {
      
      # 1. Preflight (OPTIONS)
      if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' 'http://localhost:5173' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;
        add_header 'Access-Control-Max-Age' 1728000;
        add_header 'Content-Type' 'text/plain; charset=utf-8';
        add_header 'Content-Length' 0;
        return 204;
      }

      # 2. Основные заголовки
      add_header 'Access-Control-Allow-Origin' 'http://localhost:5173' always;
      add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
      add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;
      add_header 'Access-Control-Allow-Credentials' 'true' always;

      # Чистим заголовки от n8n
      proxy_hide_header Access-Control-Allow-Origin;
      proxy_hide_header Access-Control-Allow-Methods;
      proxy_hide_header Access-Control-Allow-Headers;

      # Проксируем на контейнер n8n
      proxy_pass http://n8n:5678;
      
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Вебсокеты для n8n
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "Upgrade";
    }
  }
}
